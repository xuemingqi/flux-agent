name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check desktop tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== `desktop-v${require("./package.json").version}`) throw new Error("Desktop tag must match package.json version")'
      - run: pnpm typecheck
      - name: Test shared behavior on macOS
        if: matrix.platform == 'mac'
        run: pnpm test
      - name: Test desktop lifecycle on Windows
        if: matrix.platform == 'win'
        run: pnpm exec vitest run apps/desktop/test
      - name: Build desktop installers
        run: pnpm desktop:build --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify desktop startup and shutdown
        run: pnpm test:desktop
      - name: Verify npm browser entry after desktop build
        run: pnpm test:cli
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Flux Agent ${RELEASE_TAG#desktop-v}" --notes "macOS 和 Windows 桌面安装包；npm 浏览器版继续独立发布到 CNB。"
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
